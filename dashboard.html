<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد | PUBG Empire</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🏆 PUBG Empire</h1>
            <p>داشبورد کاربری</p>
        </div>

        <div class="dashboard-box">
            <div class="user-info">
                <div class="avatar">👤</div>
                <div>
                    <h3 id="user-name">کاربر</h3>
                    <p id="user-email">email@example.com</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <span>💰</span>
                    <p>موجودی</p>
                    <h3>0 UC</h3>
                </div>
                <div class="stat-card">
                    <span>🏆</span>
                    <p>بردها</p>
                    <h3>0</h3>
                </div>
                <div class="stat-card">
                    <span>🎮</span>
                    <p>مسابقات</p>
                    <h3>0</h3>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" id="logout-btn">🚪 خروج</button>
            </div>
        </div>
    </div>

    <script>
        const netlifyIdentity = window.netlifyIdentity;

        // نمایش اطلاعات کاربر
        netlifyIdentity.on('init', function(user) {
            if (user) {
                document.getElementById('user-name').textContent = user.user_metadata.full_name || 'کاربر';
                document.getElementById('user-email').textContent = user.email;
            }
        });

        // خروج
        document.getElementById('logout-btn').addEventListener('click', function() {
            netlifyIdentity.logout();
        });
    </script>
</body>
</html>
