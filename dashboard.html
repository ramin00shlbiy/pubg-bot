<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد | PUBG Empire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🏆 PUBG Empire</h1>
            <p>داشبورد کاربری</p>
        </div>

        <div class="dashboard-box">
            <div class="user-info">
                <div class="avatar">👤</div>
                <div>
                    <h3 id="user-name">کاربر</h3>
                    <p id="user-email">email@example.com</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <span>💰</span>
                    <p>موجودی</p>
                    <h3>0 UC</h3>
                </div>
                <div class="stat-card">
                    <span>🏆</span>
                    <p>بردها</p>
                    <h3>0</h3>
                </div>
                <div class="stat-card">
                    <span>🎮</span>
                    <p>مسابقات</p>
                    <h3>0</h3>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" id="logout-btn">🚪 خروج</button>
            </div>
        </div>
    </div>

    <script>
        // ===== بررسی وضعیت ورود =====
        const token = localStorage.getItem('netlify_token');
        const userData = localStorage.getItem('netlify_user');

        if (token && userData) {
            try {
                const user = JSON.parse(userData);
                document.getElementById('user-name').textContent = user.full_name || user.email || 'کاربر';
                document.getElementById('user-email').textContent = user.email;
            } catch (e) {
                console.error('Error parsing user data:', e);
            }
        } else {
            // اگر کاربر وارد نشده، به صفحه ورود برگردانده شود
            window.location.href = '/';
        }

        // ===== خروج =====
        document.getElementById('logout-btn').addEventListener('click', function() {
            localStorage.removeItem('netlify_token');
            localStorage.removeItem('netlify_user');
            window.location.href = '/';
        });
    </script>
</body>
</html>
