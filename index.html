<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PUBG Empire | ورود</title>
    <link rel="stylesheet" href="style.css">
    <!-- Netlify Identity Widget -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Gradient -->
    <div class="bg-gradient"></div>
    
    <div class="container">
        <!-- Brand Section -->
        <div class="brand">
            <div class="logo-icon">🏆</div>
            <h1 class="brand-title">PUBG <span>Empire</span></h1>
            <p class="brand-subtitle">مسابقات و صرافی حرفه‌ای پابجی</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">
                    <span class="tab-icon">🔐</span> ورود
                </button>
                <button class="tab-btn" data-tab="register">
                    <span class="tab-icon">📝</span> ثبت‌نام
                </button>
            </div>

            <!-- Login Form (ورود با گوگل) -->
            <div id="login-form" class="form-container active">
                <div class="social-login">
                    <button id="google-login-btn" class="btn-google">
                        <svg width="20" height="20" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        ورود با گوگل
                    </button>
                </div>
                <div class="auth-footer">
                    <span>حساب ندارید؟</span>
                    <a href="#" id="switch-to-register">ثبت‌نام کنید</a>
                </div>
            </div>

            <!-- Register Form (ثبت‌نام با نام و گوگل) -->
            <div id="register-form" class="form-container">
                <form id="register">
                    <div class="input-group">
                        <label>نام کامل</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="register-name" placeholder="نام و نام خانوادگی" required>
                        </div>
                    </div>
                    <div class="social-login">
                        <button type="button" id="google-register-btn" class="btn-google">
                            <svg width="20" height="20" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            ثبت‌نام با گوگل
                        </button>
                    </div>
                </form>
                <div class="auth-footer">
                    <span>قبلاً ثبت‌نام کرده‌اید؟</span>
                    <a href="#" id="switch-to-login">وارد شوید</a>
                </div>
            </div>
        </div>

        <!-- Features -->
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">🎮</div>
                <div class="feature-text">
                    <h4>مسابقات حرفه‌ای</h4>
                    <p>روزانه با جوایز نقدی</p>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">💰</div>
                <div class="feature-text">
                    <h4>کیف پول امن</h4>
                    <p>واریز و برداشت آنی</p>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🏆</div>
                <div class="feature-text">
                    <h4>جوایز بزرگ</h4>
                    <p>تا ۱۰۰۰ یوسی</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
