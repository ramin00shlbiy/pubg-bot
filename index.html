<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PUBG Empire | ورود</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Gradient -->
    <div class="bg-gradient"></div>
    
    <div class="container">
        <!-- Brand Section -->
        <div class="brand">
            <div class="logo-icon">🏆</div>
            <h1 class="brand-title">PUBG <span>Empire</span></h1>
            <p class="brand-subtitle">مسابقات و صرافی حرفه‌ای پابجی</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">
                    <span class="tab-icon">🔐</span> ورود
                </button>
                <button class="tab-btn" data-tab="register">
                    <span class="tab-icon">📝</span> ثبت‌نام
                </button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-container active">
                <form id="login">
                    <div class="input-group">
                        <label>ایمیل</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" placeholder="ایمیل خود را وارد کنید" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>رمز عبور</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>🚀</span> ورود به حساب
                    </button>
                </form>
                <div class="auth-footer">
                    <span>حساب ندارید؟</span>
                    <a href="#" id="switch-to-register">ثبت‌نام کنید</a>
                </div>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-container">
                <form id="register">
                    <div class="input-group">
                        <label>نام کامل</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" placeholder="نام و نام خانوادگی" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>ایمیل</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" placeholder="ایمیل خود را وارد کنید" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>رمز عبور</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" placeholder="حداقل ۶ کاراکتر" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>✨</span> ثبت‌نام
                    </button>
                </form>
                <div class="auth-footer">
                    <span>قبلاً ثبت‌نام کرده‌اید؟</span>
                    <a href="#" id="switch-to-login">وارد شوید</a>
                </div>
            </div>
        </div>

        <!-- Features -->
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">🎮</div>
                <div class="feature-text">
                    <h4>مسابقات حرفه‌ای</h4>
                    <p>روزانه با جوایز نقدی</p>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">💰</div>
                <div class="feature-text">
                    <h4>کیف پول امن</h4>
                    <p>واریز و برداشت آنی</p>
                </div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🏆</div>
                <div class="feature-text">
                    <h4>جوایز بزرگ</h4>
                    <p>تا ۱۰۰۰ یوسی</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
