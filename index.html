<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورود / ثبت‌نام | PUBG Empire</title>
    <link rel="stylesheet" href="style.css">
    <!-- Netlify Identity Widget -->
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🏆 PUBG Empire</h1>
            <p>مسابقات و صرافی پابجی</p>
        </div>

        <div class="auth-box">
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">ورود</button>
                <button class="tab-btn" data-tab="register">ثبت‌نام</button>
            </div>

            <!-- فرم ورود -->
            <div id="login-form" class="form-container active">
                <form id="login">
                    <div class="input-group">
                        <label>📧 ایمیل</label>
                        <input type="email" id="login-email" placeholder="example@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>🔒 رمز عبور</label>
                        <input type="password" id="login-password" placeholder="********" required>
                    </div>
                    <button type="submit" class="btn-primary">ورود</button>
                </form>
                <p class="switch-text">حساب ندارید؟ <a href="#" id="switch-to-register">ثبت‌نام کنید</a></p>
            </div>

            <!-- فرم ثبت‌نام -->
            <div id="register-form" class="form-container">
                <form id="register">
                    <div class="input-group">
                        <label>👤 نام کامل</label>
                        <input type="text" id="register-name" placeholder="نام خود را وارد کنید" required>
                    </div>
                    <div class="input-group">
                        <label>📧 ایمیل</label>
                        <input type="email" id="register-email" placeholder="example@email.com" required>
                    </div>
                    <div class="input-group">
                        <label>🔒 رمز عبور</label>
                        <input type="password" id="register-password" placeholder="حداقل ۶ کاراکتر" required>
                    </div>
                    <button type="submit" class="btn-primary">ثبت‌نام</button>
                </form>
                <p class="switch-text">قبلاً ثبت‌نام کرده‌اید؟ <a href="#" id="switch-to-login">وارد شوید</a></p>
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <span>🎮</span>
                <p>مسابقات روزانه</p>
            </div>
            <div class="feature">
                <span>💰</span>
                <p>کیف پول امن</p>
            </div>
            <div class="feature">
                <span>🏆</span>
                <p>جوایز نقدی</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
